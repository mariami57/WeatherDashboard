{% extends "common/base.html" %}
{% load static %}

{% block content %}
    <div class="top-bar">
    <a href="{% url 'home' %}">
        <img class="logo" src="{% static 'images/wt_logo.png' %}" alt="website-logo"/>
    </a>

    <div id="favourites-container">
        <div id="favourites-header" class="dropdown-header">
            <i class="fa-solid fa-map-pin"></i>
             <span class="tooltip-text">Favourite cities</span>
        </div>
        <ul id="favourites-list" class="dropdown-list"></ul>
    </div>
    </div>

    <div class="content-container">

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="SEARCH CITY..."/>
            <ul id="search-results"></ul>
            <div id="weather-result"></div>
            <div id="forecast-result"></div>
        </div>

    </div>

    <div class="button-fav-section">
        <button class="save-fav" id="fav-btn" data-city="">📍</button>
        <span class="tooltip-text-save">Save to favourite cities</span>
    </div>


<script src="{% static 'js/weather.js' %}"></script>
{% endblock %}
